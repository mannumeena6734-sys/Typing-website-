<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffd900;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.25);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #aaa;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #loginMessage {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

  </style>

</head>

<body>

<div class="login-box">

  <h1>🔐 Admin Login</h1>

  <form id="loginForm">

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
      required
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      required
    >

    <button type="submit">
      LOGIN
    </button>

  </form>

  <div id="loginMessage"></div>

</div>


<script>

  const SUPABASE_URL =
    "PASTE_YOUR_SUPABASE_URL_HERE";

  const SUPABASE_KEY =
    "PASTE_YOUR_PUBLISHABLE_KEY_HERE";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  document
    .getElementById("loginForm")
    .addEventListener("submit", async function(e) {

      e.preventDefault();

      const message =
        document.getElementById("loginMessage");

      message.style.color = "black";
      message.innerText = "Logging in...";


      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {

        message.style.color = "red";

        message.innerText =
          "❌ " + error.message;

        return;
      }


      // Admin email check
      const ADMIN_EMAIL =
        "YOUR_ADMIN_EMAIL@gmail.com";


      if (
        data.user.email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
      ) {

        await supabaseClient.auth.signOut();

        message.style.color = "red";

        message.innerText =
          "❌ Admin access denied.";

        return;
      }


      window.location.href =
        "admin.html";

    });

</script>

</body>
</html>
