<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login - Typing Website</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffd900;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #aaa;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #111;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #loginMessage {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      min-height: 22px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>🔐 Admin Login</h1>

    <div class="subtitle">
      Typing Website Admin Panel
    </div>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        placeholder="Admin Email"
        autocomplete="email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button
        type="submit"
        id="loginButton"
      >
        LOGIN
      </button>

    </form>

    <div id="loginMessage"></div>

  </div>


  <script>

    /* =========================================
       SUPABASE PROJECT
    ========================================= */

    const SUPABASE_URL =
      "https://ztoebrsyyknoegbisgyj.supabase.co";


    /*
      IMPORTANT:
      Ye wahi Publishable Key hai jo aapne
      pehle mujhe bheji thi.
    */

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_tZ6BzwBYeZcuohucrOvgQA_oSpp6P6h";


    /* =========================================
       ADMIN EMAIL
    ========================================= */

    const ADMIN_EMAIL =
      "typingwork246@gmail.com";


    /* =========================================
       SUPABASE CLIENT
    ========================================= */

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =========================================
       HTML ELEMENTS
    ========================================= */

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const loginMessage =
      document.getElementById("loginMessage");


    /* =========================================
       LOGIN
    ========================================= */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        loginButton.disabled = true;

        loginButton.textContent =
          "LOGIN...";

        loginMessage.style.color =
          "#111";

        loginMessage.textContent =
          "Checking login...";


        try {

          /* -------------------------------
             SUPABASE LOGIN
          ------------------------------- */

          const { data, error } =
            await supabaseClient.auth
              .signInWithPassword({

                email: email,

                password: password

              });


          /* -------------------------------
             ERROR
          ------------------------------- */

          if (error) {

            console.error(
              "Supabase error:",
              error
            );

            throw error;
          }


          /* -------------------------------
             USER CHECK
          ------------------------------- */

          if (
            !data ||
            !data.user ||
            !data.user.email
          ) {

            throw new Error(
              "User account was not returned."
            );
          }


          /* -------------------------------
             ADMIN EMAIL CHECK
          ------------------------------- */

          if (
            data.user.email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
          ) {

            await supabaseClient.auth.signOut();

            throw new Error(
              "Admin access denied."
            );
          }


          /* -------------------------------
             SUCCESS
          ------------------------------- */

          loginMessage.style.color =
            "green";

          loginMessage.textContent =
            "✅ Login successful!";


          loginButton.textContent =
            "OPENING ADMIN PANEL...";


          /*
            GitHub Pages project:
            /Typing-website-/

            admin.html isi folder me hai.
          */

          setTimeout(function() {

            window.location.href =
              "./admin.html";

          }, 700);


        } catch (error) {

          console.error(
            "Login error:",
            error
          );


          loginMessage.style.color =
            "red";


          loginMessage.textContent =
            "❌ " +
            (
              error.message ||
              "Login failed."
            );


          loginButton.disabled =
            false;

          loginButton.textContent =
            "LOGIN";
        }

      }
    );

  </script>

</body>
</html>
