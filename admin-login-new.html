<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffd900;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.25);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #aaa;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #loginMessage {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>🔐 Admin Login</h1>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        placeholder="Admin Email"
        autocomplete="username"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        LOGIN
      </button>

    </form>

    <div id="loginMessage"></div>

  </div>


  <script>

    /* ================================
       SUPABASE CONFIGURATION
       ================================ */

    const SUPABASE_URL =
      "https://ztoebrsyvknoegbisgyj.supabase.co";

    const SUPABASE_KEY =
      "PASTE_YOUR_PUBLISHABLE_KEY_HERE";


    const ADMIN_EMAIL =
      "typingwork246@gmail.com";


    /* ================================
       CREATE SUPABASE CLIENT
       ================================ */

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* ================================
       LOGIN
       ================================ */

    document
      .getElementById("loginForm")
      .addEventListener("submit", async function(e) {

        e.preventDefault();

        const message =
          document.getElementById("loginMessage");

        const loginButton =
          document.getElementById("loginButton");

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        message.style.color = "black";
        message.innerText = "Logging in...";

        loginButton.disabled = true;


        try {

          /* Check admin email BEFORE login */

          if (
            email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
          ) {

            message.style.color = "red";

            message.innerText =
              "❌ Admin access denied.";

            loginButton.disabled = false;

            return;
          }


          /* Supabase authentication */

          const { data, error } =
            await supabaseClient.auth.signInWithPassword({
              email: email,
              password: password
            });


          if (error) {

            message.style.color = "red";

            message.innerText =
              "❌ " + error.message;

            loginButton.disabled = false;

            return;
          }


          /* Extra security check */

          if (
            !data.user ||
            data.user.email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
          ) {

            await supabaseClient.auth.signOut();

            message.style.color = "red";

            message.innerText =
              "❌ Admin access denied.";

            loginButton.disabled = false;

            return;
          }


          /* Login successful */

          message.style.color = "green";

          message.innerText =
            "✅ Login successful. Opening Admin Panel...";


          setTimeout(function() {

            window.location.href =
              "admin.html";

          }, 500);


        } catch (error) {

          message.style.color = "red";

          message.innerText =
            "❌ Something went wrong. Please try again.";

          loginButton.disabled = false;

        }

      });

  </script>

</body>
</html>
