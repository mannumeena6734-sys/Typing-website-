<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }


    body {
      margin: 0;
      background: #f2f2f2;
      color: #222;
    }


    header {
      background: #111;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }


    header h1 {
      margin: 0;
      font-size: 22px;
    }


    .logout {
      background: #ffd900;
      border: none;
      padding: 10px 15px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }


    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }


    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }


    .stat {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.1);
    }


    .stat h2 {
      margin: 0;
      font-size: 30px;
    }


    .qr-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.1);
    }


    .qr-box h2 {
      margin-top: 0;
    }


    .qr-preview {
      display: block;
      width: 250px;
      max-width: 100%;
      min-height: 150px;
      object-fit: contain;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin: 15px 0;
    }


    .file-input {
      width: 100%;
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 7px;
      margin-bottom: 12px;
      background: white;
    }


    .upload-btn {
      background: #111;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }


    .upload-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }


    #qrStatus {
      margin-top: 12px;
      font-weight: bold;
    }


    .table-box {
      background: white;
      padding: 15px;
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 3px 12px rgba(0,0,0,.1);
    }


    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1050px;
    }


    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }


    th {
      background: #111;
      color: white;
    }


    .delete-btn {
      background: #d60000;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }


    .refresh-btn {
      background: #111;
      color: white;
      border: none;
      padding: 11px 18px;
      border-radius: 7px;
      cursor: pointer;
      margin-bottom: 15px;
    }


    #status {
      margin-bottom: 15px;
      font-weight: bold;
    }


    @media(max-width:700px) {

      header {
        flex-direction: column;
        align-items: stretch;
      }


      .stats {
        grid-template-columns: 1fr;
      }


      header h1 {
        text-align: center;
      }

    }

  </style>

</head>


<body>


<header>

  <h1>🔐 Admin Panel</h1>

  <button
    class="logout"
    onclick="logout()"
  >

    LOGOUT

  </button>

</header>


<div class="container">


  <!-- =================================
       STATS
  ================================== -->

  <div class="stats">


    <div class="stat">

      <p>Total Applications</p>

      <h2 id="totalApplications">
        0
      </h2>

    </div>


    <div class="stat">

      <p>Plan 1</p>

      <h2 id="plan1">
        0
      </h2>

    </div>


    <div class="stat">

      <p>Plan 2/3</p>

      <h2 id="plan23">
        0
      </h2>

    </div>


  </div>


  <!-- =================================
       QR MANAGEMENT
  ================================== -->

  <div class="qr-box">

    <h2>💳 Payment QR Management</h2>

    <p>
      Yahan se website ka payment QR change karein.
    </p>


    <img
      id="qrPreview"
      class="qr-preview"
      alt="Current Payment QR"
    >


    <input
      type="file"
      id="qrFile"
      class="file-input"
      accept="image/png,image/jpeg,image/jpg,image/webp"
    >


    <button
      class="upload-btn"
      id="uploadQRButton"
      onclick="uploadQR()"
    >

      📤 Upload & Save QR

    </button>


    <div id="qrStatus"></div>

  </div>


  <!-- =================================
       APPLICATIONS
  ================================== -->

  <button
    class="refresh-btn"
    onclick="loadApplications()"
  >

    🔄 Refresh Applications

  </button>


  <div id="status"></div>


  <div class="table-box">


    <table>


      <thead>

        <tr>

          <th>Name</th>

          <th>Email</th>

          <th>Phone</th>

          <th>Plan</th>

          <th>UTR / Transaction ID</th>

          <th>Message</th>

          <th>Date</th>

          <th>Action</th>

        </tr>

      </thead>


      <tbody id="applicationsTable">

      </tbody>


    </table>


  </div>


</div>


<script>


  // =====================================
  // SUPABASE CONFIG
  // =====================================

  const SUPABASE_URL =
    "https://ztoebrsyyknoegbisgyj.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_tZ6BzwBYeZcuohucrOvgQA_oSpp6P6h";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =====================================
  // ADMIN EMAIL
  // =====================================

  const ADMIN_EMAIL =
    "typingwork246@gmail.com";


  // =====================================
  // CHECK ADMIN
  // =====================================

  async function checkAdmin() {

    const {
      data: {
        user
      }
    } =
      await supabaseClient.auth.getUser();


    if (!user) {

      window.location.href =
        "admin-login.html";

      return false;

    }


    if (
      !user.email ||
      user.email.toLowerCase() !==
      ADMIN_EMAIL.toLowerCase()
    ) {

      await supabaseClient.auth.signOut();


      window.location.href =
        "admin-login.html";


      return false;

    }


    return true;

  }


  // =====================================
  // LOAD CURRENT QR
  // =====================================

  async function loadQR() {

    const status =
      document.getElementById("qrStatus");


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("site_settings")
          .select("payment_qr_url")
          .eq("id", 1)
          .maybeSingle();


      if (error) {

        console.error(error);

        status.style.color =
          "red";

        status.innerText =
          "❌ QR load error: " +
          error.message;

        return;

      }


      if (
        data &&
        data.payment_qr_url
      ) {

        document
          .getElementById("qrPreview")
          .src =
          data.payment_qr_url;

        status.style.color =
          "green";

        status.innerText =
          "✅ Current QR loaded.";

      } else {

        status.innerText =
          "No QR configured.";

      }

    } catch (error) {

      console.error(error);

    }

  }


  // =====================================
  // UPLOAD QR
  // =====================================

  async function uploadQR() {

    const allowed =
      await checkAdmin();


    if (!allowed) return;


    const file =
      document
        .getElementById("qrFile")
        .files[0];


    const status =
      document.getElementById("qrStatus");


    const button =
      document.getElementById("uploadQRButton");


    if (!file) {

      status.style.color =
        "red";

      status.innerText =
        "❌ Pehle QR image select karein.";

      return;

    }


    const allowedTypes = [
      "image/png",
      "image/jpeg",
      "image/jpg",
      "image/webp"
    ];


    if (
      !allowedTypes.includes(
        file.type
      )
    ) {

      status.style.color =
        "red";

      status.innerText =
        "❌ Sirf PNG, JPG, JPEG ya WEBP image allowed hai.";

      return;

    }


    if (
      file.size >
      5 * 1024 * 1024
    ) {

      status.style.color =
        "red";

      status.innerText =
        "❌ Image 5MB se chhoti honi chahiye.";

      return;

    }


    button.disabled = true;


    status.style.color =
      "#222";

    status.innerText =
      "Uploading QR...";


    try {


      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      const fileName =
        "payment-qr-" +
        Date.now() +
        "." +
        extension;


      // Upload image

      const {
        error: uploadError
      } =
        await supabaseClient
          .storage
          .from("payment-qr")
          .upload(
            fileName,
            file,
            {
              cacheControl: "3600",
              upsert: false,
              contentType: file.type
            }
          );


      if (uploadError) {

        throw uploadError;

      }


      // Get public URL

      const {
        data: publicData
      } =
        supabaseClient
          .storage
          .from("payment-qr")
          .getPublicUrl(
            fileName
          );


      const publicURL =
        publicData.publicUrl;


      // Save URL to database

      const {
        error: dbError
      } =
        await supabaseClient
          .from("site_settings")
          .update({
            payment_qr_url:
              publicURL
          })
          .eq("id", 1);


      if (dbError) {

        throw dbError;

      }


      // Update preview

      document
        .getElementById("qrPreview")
        .src =
        publicURL;


      status.style.color =
        "green";


      status.innerText =
        "✅ QR successfully updated!";


      document
        .getElementById("qrFile")
        .value = "";


    } catch (error) {

      console.error(error);


      status.style.color =
        "red";


      status.innerText =
        "❌ QR upload failed: " +
        error.message;

    }


    button.disabled = false;

  }


  // =====================================
  // LOAD APPLICATIONS
  // =====================================

  async function loadApplications() {

    const allowed =
      await checkAdmin();


    if (!allowed) return;


    const status =
      document.getElementById("status");


    status.style.color =
      "#222";


    status.innerText =
      "Loading applications...";


    const {
      data,
      error
    } =
      await supabaseClient
        .from("applications")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(error);


      status.style.color =
        "red";


      status.innerText =
        "❌ Error: " +
        error.message;


      return;

    }


    status.style.color =
      "green";


    status.innerText =
      "✅ Applications loaded";


    displayApplications(
      data || []
    );

  }


  // =====================================
  // DISPLAY APPLICATIONS
  // =====================================

  function displayApplications(
    applications
  ) {

    const table =
      document.getElementById(
        "applicationsTable"
      );


    table.innerHTML = "";


    document.getElementById(
      "totalApplications"
    ).innerText =
      applications.length;


    let plan1 = 0;

    let plan23 = 0;


    applications.forEach(
      function(app) {


        if (
          app.plan ===
          "Typing Plan 1"
        ) {

          plan1++;

        } else {

          plan23++;

        }


        const row =
          document.createElement("tr");


        row.innerHTML = `

          <td>
            ${escapeHTML(
              app.name || ""
            )}
          </td>


          <td>
            ${escapeHTML(
              app.email || ""
            )}
          </td>


          <td>
            ${escapeHTML(
              app.phone || ""
            )}
          </td>


          <td>
            ${escapeHTML(
              app.plan || ""
            )}
          </td>


          <td>
            ${escapeHTML(
              app.payment_utr || ""
            )}
          </td>


          <td>
            ${escapeHTML(
              app.message || ""
            )}
          </td>


          <td>
            ${
              app.created_at
              ? new Date(
                  app.created_at
                ).toLocaleString()
              : ""
            }
          </td>


          <td>

            <button
              class="delete-btn"
              onclick="deleteApplication('${escapeJS(app.id)}')"
            >

              Delete

            </button>

          </td>

        `;


        table.appendChild(row);

      }
    );


    document.getElementById(
      "plan1"
    ).innerText =
      plan1;


    document.getElementById(
      "plan23"
    ).innerText =
      plan23;

  }


  // =====================================
  // DELETE APPLICATION
  // =====================================

  async function deleteApplication(
    id
  ) {

    if (
      !confirm(
        "Kya aap is application ko delete karna chahte hain?"
      )
    ) {

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .from("applications")
        .delete()
        .eq(
          "id",
          id
        );


    if (error) {

      alert(
        "Delete error: " +
        error.message
      );

      return;

    }


    alert(
      "Application deleted."
    );


    loadApplications();

  }


  // =====================================
  // LOGOUT
  // =====================================

  async function logout() {

    await supabaseClient.auth.signOut();


    window.location.href =
      "admin-login.html";

  }


  // =====================================
  // HTML SECURITY
  // =====================================

  function escapeHTML(
    value
  ) {

    return String(value)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  function escapeJS(
    value
  ) {

    return String(value)
      .replace(
        /\\/g,
        "\\\\"
      )
      .replace(
        /'/g,
        "\\'"
      );

  }


  // =====================================
  // START
  // =====================================

  async function startAdmin() {

    const allowed =
      await checkAdmin();


    if (!allowed) return;


    await loadQR();


    await loadApplications();

  }


  startAdmin();


</script>


</body>

</html>
